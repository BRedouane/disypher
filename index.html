<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Disypher — classical cipher analyser</title>
    <meta
      name="description"
      content="Decrypt a text and rank the hypotheses by confidence. Python engine running in the browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      One file, no build step, no framework.

      The engine is not rewritten in JavaScript: `cipher.py` is loaded as-is and
      executed by Pyodide, a build of Python compiled to WebAssembly. The same
      file therefore runs in a terminal and in this page.

      The engine returns no ready-made sentences: it returns codes and
      parameters. The wording seen here is assembled by the page, which is what
      makes it translatable without touching the library.

      Layout: input and settings on the left, result on the right. The result
      never falls below the fold, and changing a setting re-runs the analysis
      with nothing to confirm.
    -->
    <style>
      :root {
        --ink: #08080a;
        --surface: #101013;
        --surface-2: #0b0b0d;
        --line: rgba(241, 240, 235, 0.1);
        --line-strong: rgba(241, 240, 235, 0.22);
        --paper: #f1f0eb;
        --muted: #9b9b98;
        --faint: #676764;
        --acid: #c8ff3d;
        --purple: #9d84ff;
        --amber: #ffb454;
        --alert: #ff8b7a;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --sans: "DM Sans", system-ui, sans-serif;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --r-pane: 22px;
        --r-card: 14px;
        --r-ctrl: 9px;
      }

      * { box-sizing: border-box; }

      /* Wherever digits carry meaning — shifts, scores, indices — a slashed
         zero and tabular figures avoid confusion and stop columns from
         shifting as values change. */
      .chip, .result-detail, .result-score, .variant-params, .variant-score,
      .metric strong, .status, .stage-label {
        font-variant-numeric: slashed-zero tabular-nums;
        font-feature-settings: "zero" 1, "tnum" 1;
      }

      /* The whole page is sized in `rem`, so varying the root is enough to make
         it breathe: it grows with the window instead of staying frozen at small
         type on a 27-inch screen, without ever dropping below 16px or passing
         18.5. The useful range is narrow — two and a half points separate too
         small from too large. */
      html {
        font-size: clamp(16px, 0.22vw + 14.6px, 18.5px);
        scroll-behavior: smooth;
      }

      /* Scrollbars.
         The Windows default is wide, light and opaque, cutting across the
         right-hand panel. It is kept — removing it would remove the only clue
         that more content lies below — but reduced to a thin line that only
         becomes noticeable on hover.

         Two syntaxes, no redundancy: the first is the standard property,
         understood by Firefox; the second, prefixed, covers Chrome, Edge and
         Safari, which do not implement the first yet. */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(241, 240, 235, 0.16) transparent;
      }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        /* A transparent border combined with `padding-box` visually thins the
           thumb without shrinking the clickable area: the mouse target stays
           comfortable while only a line is drawn. */
        background: rgba(241, 240, 235, 0.14);
        background-clip: padding-box;
        border: 2px solid transparent;
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(241, 240, 235, 0.3);
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-corner { background: transparent; }

      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(1100px 620px at 8% -12%, rgba(157, 132, 255, 0.14), transparent 60%),
          radial-gradient(900px 520px at 100% 4%, rgba(200, 255, 61, 0.075), transparent 58%),
          var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        line-height: 1.6;
      }

      .wrap { max-width: 84rem; margin: 0 auto; padding: 2.6rem 3vw 4rem; }

      /* ── Header ──────────────────────────────────────────────── */
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        margin-bottom: 1.6rem;
      }
      .brand { display: flex; align-items: baseline; gap: 1rem; min-width: 0; }
      h1 {
        margin: 0;
        font-size: 1.9rem;
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1;
      }
      h1 span { color: var(--acid); }
      .tagline {
        min-width: 0;
        color: var(--faint);
        font: 0.62rem var(--mono);
        letter-spacing: 0.04em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .head-actions { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
      .backlink {
        padding: 0.36rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: var(--r-ctrl);
        color: var(--muted);
        font: 0.6rem var(--mono);
        text-decoration: none;
        white-space: nowrap;
        transition: 0.2s var(--ease);
      }
      .backlink:hover { border-color: var(--purple); color: var(--purple); }

      /* Language and mode selectors: a single rail where only the active segment
         carries a surface. Two filled buttons side by side would compete for
         attention without indicating anything. */
      .segmented {
        display: flex;
        gap: 0.2rem;
        padding: 0.22rem;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--surface-2);
      }
      .segmented button {
        padding: 0.34rem 0.8rem;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--faint);
        font: 0.6rem var(--mono);
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: 0.2s var(--ease);
      }
      .segmented button:hover { color: var(--paper); }
      .segmented button[aria-pressed="true"] {
        background: rgba(241, 240, 235, 0.08);
        color: var(--paper);
      }
      .mode-switch button[aria-pressed="true"] {
        background: rgba(200, 255, 61, 0.13);
        color: var(--acid);
      }
      .mode-switch { padding: 0.26rem; }
      .mode-switch button { padding: 0.42rem 1.15rem; font-size: 0.64rem; text-transform: uppercase; }

      /* ── Espace de travail ───────────────────────────────────── */
      .app {
        display: grid;
        grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
        gap: 1.1rem;
        align-items: start;
      }
      @media (max-width: 1120px) { .app { grid-template-columns: 1fr; } }

      /* Panels are not plain rectangles: a very light gradient surface, a pale
         line along the top that suggests a lit edge, and a generous radius.
         The whole reads as an object rather than a border. */
      .pane {
        position: relative;
        border: 1px solid var(--line);
        border-radius: var(--r-pane);
        background:
          linear-gradient(180deg, rgba(241, 240, 235, 0.045), rgba(241, 240, 235, 0.012) 38%,
                          rgba(241, 240, 235, 0.006)),
          var(--surface);
        box-shadow: 0 24px 60px -32px rgba(0, 0, 0, 0.9);
        /* No `overflow: hidden`: it clipped tooltips extending past the panel.
           The top highlight fades to transparent at both ends, so nothing
           visibly spills out of the rounded corners. */
      }
      .pane::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(241, 240, 235, 0.22), transparent);
      }

      .pane-out {
        position: sticky;
        top: 1.4rem;
        max-height: calc(100dvh - 2.8rem);
        display: flex;
        flex-direction: column;
      }
      @media (max-width: 1120px) { .pane-out { position: static; max-height: none; } }

      /* An accent line on the flank of the output panel: it distinguishes the
         result from the input without adding another frame. */
      .pane-out::after {
        content: "";
        position: absolute;
        left: 0; top: 18%; bottom: 18%;
        width: 2px;
        border-radius: 2px;
        background: linear-gradient(180deg, transparent, var(--acid), transparent);
        opacity: 0.5;
      }

      .pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.05rem 1.4rem 0.9rem;
        border-bottom: 1px solid var(--line);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--faint);
        font: 0.62rem var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 14px;
        height: 1px;
        background: var(--line-strong);
      }
      .pane-body { padding: 1.2rem 1.4rem 1.4rem; }
      .pane-out .pane-body { overflow-y: auto; flex: 1 1 auto; }

      /* ── Champ de saisie ─────────────────────────────────────── */
      /* The field is recessed rather than placed on top: darker than the panel,
         with no border of its own. It reads as a hollow, not another box. */
      textarea {
        width: 100%;
        min-height: 168px;
        padding: 1rem 1.1rem;
        border: 1px solid transparent;
        border-radius: var(--r-card);
        background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.5);
        color: var(--paper);
        font: 0.88rem/1.75 var(--mono);
        resize: vertical;
      }
      textarea:focus { outline: none; border-color: rgba(200, 255, 61, 0.45); }
      textarea::placeholder { color: var(--faint); }

      input, select {
        width: 100%;
        padding: 0.5rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: var(--r-ctrl);
        background: var(--surface-2);
        color: var(--paper);
        font: 0.78rem var(--mono);
      }
      input:focus, select:focus { outline: 1px solid var(--acid); outline-offset: 0; }
      input::placeholder { color: var(--faint); }
      /* Native dropdowns inherit the system light theme: without these two
         rules the list opens white on white. */
      select { color-scheme: dark; }
      select option { background: var(--surface); color: var(--paper); }

      /* ── Settings ────────────────────────────────────────────── */
      /* Thin separators rather than stacked cards: the options form one
         articulated block, not four repeated frames. */
      .section { padding-top: 1.15rem; margin-top: 1.15rem; border-top: 1px solid var(--line); }
      .section-title {
        margin: 0 0 0.75rem;
        color: var(--muted);
        font: 500 0.64rem var(--mono);
        letter-spacing: 0.06em;
      }
      .hint { margin: 0 0 0.85rem; color: var(--faint); font: 0.63rem/1.55 var(--mono); }

      .chips { display: flex; flex-wrap: wrap; gap: 0.32rem; }
      .chip {
        min-width: 2.3rem;
        padding: 0.26rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--faint);
        font: 0.72rem var(--mono);
        letter-spacing: 0.02em;
        text-align: center;
        cursor: pointer;
        transition: 0.15s var(--ease);
      }
      .chip:hover { border-color: var(--line-strong); color: var(--paper); }
      .chip[aria-pressed="true"] {
        border-color: transparent;
        background: rgba(200, 255, 61, 0.14);
        color: var(--acid);
      }
      .chip-method { text-transform: uppercase; font-size: 0.64rem; min-width: auto; }
      .chip-method[aria-pressed="true"] {
        background: rgba(157, 132, 255, 0.16);
        color: var(--purple);
      }
      .chip-all { min-width: auto; }
      .chip-range { min-width: auto; }

      .pinblock + .pinblock { margin-top: 0.9rem; }
      .pinblock > h4 {
        margin: 0 0 0.5rem;
        color: var(--paper);
        font: 500 0.7rem var(--mono);
      }
      .pinrow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.32rem; margin-bottom: 0.45rem; }
      .pinrow > .tiny-label {
        flex: 0 0 6.4rem;
        color: var(--faint);
        font: 0.61rem var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .pinrow input[type="text"] { flex: 1 1 9rem; width: auto; }
      .pinnote {
        margin: 0.1rem 0 0;
        color: var(--faint);
        font: 0.62rem/1.55 var(--mono);
      }
      .pinhint { margin: -0.15rem 0 0.6rem 6.7rem; color: var(--faint); font: 0.6rem var(--mono); }

      /* ── Étapes de chiffrement ───────────────────────────────── */
      .step {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.55rem;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: var(--surface-2);
      }
      .step + .step { margin-top: 0.5rem; }
      .step-index {
        flex: 0 0 1.3rem;
        align-self: center;
        color: var(--purple);
        font: 500 0.76rem var(--mono);
      }
      .step-field { flex: 0 1 7.6rem; }
      .step-field.wide { flex: 1 1 9rem; }
      .step-field .tiny-label {
        display: block;
        margin-bottom: 0.3rem;
        color: var(--faint);
        font: 0.59rem var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .step-flags { display: flex; flex-wrap: wrap; gap: 0.3rem; align-self: center; }
      .icon-btn {
        align-self: center;
        margin-left: auto;
        width: 1.7rem; height: 1.7rem;
        display: grid; place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--faint);
        font: 0.7rem var(--mono);
        cursor: pointer;
        transition: 0.15s var(--ease);
      }
      .icon-btn:hover:not([disabled]) { border-color: var(--amber); color: var(--amber); }
      .icon-btn[disabled] { opacity: 0.28; cursor: not-allowed; }

      .ghost {
        margin-top: 0.7rem;
        padding: 0.5rem 0.9rem;
        border: 1px dashed var(--line-strong);
        border-radius: var(--r-ctrl);
        background: transparent;
        color: var(--muted);
        font: 0.64rem var(--mono);
        cursor: pointer;
        transition: 0.2s var(--ease);
      }
      .ghost:hover:not([disabled]) { border-color: var(--acid); border-style: solid; color: var(--acid); }
      .ghost[disabled] { opacity: 0.35; cursor: not-allowed; }

      .chain-foot { display: flex; align-items: center; gap: 0.8rem; }
      .step-count {
        color: var(--faint);
        font: 0.64rem var(--mono);
        font-variant-numeric: slashed-zero tabular-nums;
      }
      .step-count.at-limit { color: var(--amber); }

      /* ── Statut ──────────────────────────────────────────────── */
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        color: var(--faint);
        font: 0.64rem var(--mono);
      }
      .status::before {
        content: "";
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--faint);
        transition: 0.25s var(--ease);
      }
      .status[data-state="ready"]::before { background: var(--acid); box-shadow: 0 0 8px rgba(200,255,61,.6); }
      .status[data-state="busy"]::before { background: var(--amber); animation: pulse 0.9s ease-in-out infinite; }
      .status[data-state="error"]::before { background: var(--amber); }
      @keyframes pulse { 50% { opacity: 0.25; } }

      /* ── Result ──────────────────────────────────────────────── */
      .verdict {
        padding: 0.85rem 1rem 0.85rem 1.05rem;
        border-radius: var(--r-card);
        border-left: 2px solid;
        font-size: 0.82rem;
      }
      .verdict.sure { border-color: var(--acid); background: rgba(200, 255, 61, 0.06); }
      .verdict.unsure { border-color: var(--amber); background: rgba(255, 180, 84, 0.06); }
      .verdict.plain { border-color: var(--purple); background: rgba(157, 132, 255, 0.07); }
      .verdict b { display: block; margin-bottom: 0.2rem; font-size: 0.78rem; }
      .verdict.sure b { color: var(--acid); }
      .verdict.unsure b { color: var(--amber); }
      .verdict.plain b { color: var(--purple); }
      .verdict p { margin: 0; color: var(--muted); font-size: 0.75rem; line-height: 1.6; }

      .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.9rem; }
      .metric {
        padding: 0.6rem 0.75rem;
        border-radius: 11px;
        background: var(--surface-2);
      }
      .metric span {
        display: block;
        color: var(--faint);
        font: 0.59rem var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .metric strong { font: 500 1.02rem var(--mono); }

      .results { margin-top: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; }
      .result {
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: var(--surface-2);
        animation: rise 0.4s var(--ease) both;
      }
      .result.best {
        border-color: rgba(200, 255, 61, 0.35);
        background: linear-gradient(180deg, rgba(200, 255, 61, 0.05), transparent 60%), var(--surface-2);
      }
      @keyframes rise { from { opacity: 0; transform: translateY(7px); } }

      .result-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.6rem; }
      .result-name { font: 500 0.8rem var(--mono); }
      .result.best .result-name { color: var(--acid); }
      .result-detail { color: var(--faint); font: 0.63rem var(--mono); }
      .result-score { margin-left: auto; font: 500 0.8rem var(--mono); }
      .tag {
        padding: 0.08rem 0.38rem;
        border: 1px solid var(--purple);
        border-radius: 5px;
        color: var(--purple);
        font: 0.59rem var(--mono);
        text-transform: uppercase;
      }

      .bar { height: 2px; margin: 0.6rem 0; border-radius: 2px; background: rgba(241,240,235,.08); }
      .bar i {
        display: block; height: 100%; border-radius: 2px;
        background: var(--acid);
        transform-origin: left;
        animation: grow 0.55s var(--ease) both;
      }
      .result:not(.best) .bar i { background: var(--line-strong); }
      @keyframes grow { from { transform: scaleX(0); } }

      /* Text is no longer truncated at the source: it is rendered whole and the
         height is contained. Cutting the data to fit the layout decides for the
         reader what they are allowed to see; a scrolling frame decides
         nothing. */
      .plaintext {
        margin: 0;
        max-height: 13rem;
        overflow-y: auto;
        color: var(--paper);
        font: 0.79rem/1.7 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .result:not(.best) .plaintext { color: var(--muted); }


      /* Report of what a method left untouched. Believing a text protected when
         half of it came through in the clear is the most expensive mistake
         available here. */
      .untouched {
        display: flex;
        align-items: flex-start;
        gap: 0.45rem;
        margin-top: 0.6rem;
        padding: 0.42rem 0.6rem;
        border-left: 2px solid var(--amber);
        border-radius: 0 7px 7px 0;
        background: rgba(255, 180, 84, 0.08);
        color: var(--amber);
        font: 0.67rem/1.5 var(--mono);
      }
      .untouched::before { content: "i"; font-weight: 600; font-style: italic; opacity: 0.85; }
      /* Red is reserved for the one serious case: the method did nothing. */
      .untouched.alert {
        border-left-color: var(--alert);
        background: rgba(255, 139, 122, 0.1);
        color: var(--alert);
      }
      .untouched.alert::before { content: "!"; font-style: normal; }
      .stage .untouched { margin-top: 0.35rem; }
      .peel {
        margin-top: 0.65rem;
        padding: 0.28rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--faint);
        font: 0.62rem var(--mono);
        cursor: pointer;
        transition: 0.15s var(--ease);
      }
      .peel:hover { border-color: var(--acid); color: var(--acid); }

      /* Variants use <details>: the browser already provides folding, keyboard
         handling and screen-reader announcement. The list is complete —
         truncating part of it would give the illusion of exhaustiveness
         without offering it. */
      details.variants { margin-top: 0.7rem; border-top: 1px solid var(--line); padding-top: 0.55rem; }
      details.variants summary {
        color: var(--muted);
        font: 0.62rem var(--mono);
        cursor: pointer;
        list-style: none;
        user-select: none;
      }
      details.variants summary::-webkit-details-marker { display: none; }
      details.variants summary::before {
        content: "▾";
        display: inline-block;
        margin-right: 0.4rem;
        color: var(--purple);
        transition: transform 0.2s var(--ease);
      }
      details.variants[open] summary::before { transform: rotate(180deg); }
      details.variants summary:hover { color: var(--paper); }
      .variants-list { max-height: 17rem; overflow-y: auto; margin-top: 0.4rem; }
      .variant {
        display: flex; align-items: baseline; gap: 0.65rem;
        padding: 0.34rem 0;
        border-bottom: 1px solid rgba(241, 240, 235, 0.045);
      }
      .variant:last-child { border-bottom: 0; }
      .variant-params { flex: 0 0 7.4rem; color: var(--purple); font: 0.62rem var(--mono); }
      .variant-text {
        flex: 1 1 auto; min-width: 0;
        color: var(--muted); font: 0.64rem var(--mono);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .variant-score { flex: 0 0 auto; color: var(--faint); font: 0.62rem var(--mono); }

      /* ── Encryption stages, output side ──────────────────────── */
      .stage { display: flex; gap: 0.7rem; padding: 0.55rem 0; }
      .stage + .stage { border-top: 1px solid rgba(241, 240, 235, 0.05); }
      .stage-label { flex: 0 0 8.4rem; color: var(--purple); font: 0.64rem var(--mono); }
      .stage-text {
        flex: 1 1 auto; min-width: 0;
        color: var(--muted); font: 0.72rem/1.65 var(--mono);
        word-break: break-all;
      }
      .stage.final .stage-text { color: var(--paper); }
      .stage-note { color: var(--amber); font: 0.61rem var(--mono); }

      .empty { color: var(--faint); font: 0.72rem/1.7 var(--mono); }

      /* ── Bouton d'information et fiche ───────────────────────── */
      /* The chip and its "i" form a visual pair but remain two distinct
         buttons: nesting one button inside another would break keyboard
         navigation and screen readers. */
      .chip-pair { display: inline-flex; align-items: stretch; gap: 2px; }
      .chip-pair .chip { border-top-right-radius: 0; border-bottom-right-radius: 0; }
      .info-btn {
        display: grid;
        place-items: center;
        width: 1.7rem;
        border: 1px solid var(--line);
        border-radius: 0 8px 8px 0;
        background: rgba(157, 132, 255, 0.09);
        color: var(--purple);
        /* A lowercase italic "i" reads as a stray stroke at this size. A
           sans-serif capital cannot be mistaken for anything else. */
        font: 600 0.86rem var(--sans);
        line-height: 1;
        cursor: pointer;
        transition: 0.15s var(--ease);
      }
      .info-btn:hover, .info-btn:focus-visible {
        border-color: var(--purple);
        background: rgba(157, 132, 255, 0.2);
        color: var(--paper);
      }
      .step-info {
        border-radius: 8px;
        width: 2rem;
        align-self: center;
      }

      /* A touch target under 44px gets missed. The clickable area is therefore
         extended with a pseudo-element rather than by enlarging the button:
         layout is unchanged, only the sensitive surface grows. */
      @media (pointer: coarse) {
        .info-btn { position: relative; width: 2.3rem; }
        .info-btn::after {
          content: "";
          position: absolute;
          top: 50%; left: 50%;
          width: 44px; height: 44px;
          transform: translate(-50%, -50%);
        }
        .chip { min-height: 2.1rem; padding-inline: 0.7rem; }
        .icon-btn, .modal-close { width: 2.3rem; height: 2.3rem; }
      }


      /* Scope tooltip, rendered in CSS from `data-tip`: no script, no floating
         element to reposition, and it disappears on its own. `focus-within`
         also reveals it on tab — there is no hover on a keyboard. */
      .chip-pair { position: relative; }
      .chip-pair::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 7px);
        left: 0;
        z-index: 40;
        width: max-content;
        max-width: 19rem;
        padding: 0.5rem 0.7rem;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        background: var(--surface);
        box-shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.9);
        color: var(--muted);
        font: 0.66rem/1.55 var(--mono);
        text-transform: none;
        letter-spacing: 0;
        white-space: normal;
        opacity: 0;
        transform: translateY(3px);
        pointer-events: none;
        transition: 0.16s var(--ease);
      }
      .chip-pair:hover::after,
      .chip-pair:focus-within::after { opacity: 1; transform: none; }
      /* The last chips in a row overflow to the right, so their tooltip anchors
         from the right edge to stay inside the panel. */
      .chip-pair:nth-last-child(-n + 3)::after { left: auto; right: 0; }
      @media (pointer: coarse) { .chip-pair::after { display: none; } }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 5vh 5vw;
        background: rgba(4, 4, 6, 0.62);
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        animation: fade 0.22s var(--ease);
      }
      @keyframes fade { from { opacity: 0; } }

      .modal-card {
        position: relative;
        width: min(46rem, 100%);
        max-height: 88vh;
        overflow-y: auto;
        padding: 2rem 2.2rem 2.2rem;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-pane);
        background:
          linear-gradient(180deg, rgba(241, 240, 235, 0.05), rgba(241, 240, 235, 0.012) 40%,
                          rgba(241, 240, 235, 0.006)),
          var(--surface);
        box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.95);
        animation: lift 0.26s var(--ease) both;
      }
      @keyframes lift { from { opacity: 0; transform: translateY(14px) scale(0.985); } }

      .modal-close {
        position: absolute;
        top: 1rem; right: 1rem;
        width: 1.9rem; height: 1.9rem;
        display: grid; place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--faint);
        font: 0.72rem var(--mono);
        cursor: pointer;
        transition: 0.15s var(--ease);
      }
      .modal-close:hover { border-color: var(--amber); color: var(--amber); }

      .modal-era {
        margin: 0 0 0.35rem;
        color: var(--purple);
        font: 0.64rem var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .modal-title {
        margin: 0 0 1.3rem;
        font-size: 1.55rem;
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      /* Collapsible sections. `<details>` supplies folding, keyboard handling
         and screen-reader announcement without a line of script. */
      .info-section { border-top: 1px solid var(--line); }
      .info-section:first-child { border-top: 0; }
      .info-section > summary {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.95rem 0;
        color: var(--acid);
        font: 500 0.72rem var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }
      .info-section > summary::-webkit-details-marker { display: none; }
      .info-section > summary::before {
        content: "+";
        width: 1.05rem; height: 1.05rem;
        display: grid; place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1;
        transition: 0.2s var(--ease);
      }
      .info-section[open] > summary::before { content: "−"; border-color: var(--acid); color: var(--acid); }
      .info-section > summary:hover::before { border-color: var(--acid); }
      .info-content { padding-bottom: 1rem; }
      .info-content p:last-child { margin-bottom: 0; }

      /* Cross-reference to another card. A button, not a link: it goes nowhere,
         it replaces the displayed content. */
      .xref-self {
        color: var(--paper);
        font-style: normal;
        font-weight: 500;
      }
      .xref {
        padding: 0;
        border: 0;
        border-bottom: 1px solid rgba(200, 255, 61, 0.4);
        background: none;
        color: var(--acid);
        font: inherit;
        cursor: pointer;
        transition: 0.15s var(--ease);
      }
      .xref:hover, .xref:focus-visible {
        border-bottom-color: var(--acid);
        background: rgba(200, 255, 61, 0.12);
      }
      .modal-body h3 {
        margin: 1.4rem 0 0.5rem;
        color: var(--acid);
        font: 500 0.62rem var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .modal-body p { margin: 0 0 0.7rem; color: var(--muted); font-size: 0.86rem; line-height: 1.68; }
      .modal-body p strong { color: var(--paper); font-weight: 500; }
      .modal-body dl { margin: 0; }
      .modal-body dt {
        margin-top: 0.7rem;
        color: var(--paper);
        font: 500 0.74rem var(--mono);
      }
      .modal-body dd { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.82rem; line-height: 1.6; }

      /* Diagrams are produced by the engine, not drawn by hand, so they cannot
         drift from what the code actually does. */
      .diagram {
        margin: 0.3rem 0 0.5rem;
        padding: 0.9rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: var(--surface-2);
        color: var(--paper);
        font: 0.76rem/1.75 var(--mono);
        white-space: pre;
        overflow-x: auto;
      }

      footer {
        max-width: 84rem;
        margin: 2rem auto 0;
        padding: 0 3vw;
        color: var(--faint);
        font: 0.6rem/1.7 var(--mono);
      }
      footer a { color: var(--muted); }
      .hidden { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header class="masthead">
        <div class="brand">
          <h1>Disy<span>pher</span></h1>
          <p class="tagline" data-i18n="kicker"></p>
        </div>
        <div class="head-actions">
          <!-- Absolute link to the main site: Disypher is meant to be published on
               its own as a public tool, where a relative path would point
               nowhere. -->
          <a class="backlink" href="https://disyner.com" data-i18n="backlink"></a>
          <div class="segmented lang" role="group" aria-label="Language">
            <button data-lang="en" aria-pressed="true">EN</button>
            <button data-lang="fr" aria-pressed="false">FR</button>
          </div>
        </div>
      </header>

      <div class="app">
        <!-- ═══ Left column: input, then settings ═══ -->
        <section class="pane pane-in">
          <div class="pane-head">
            <span class="eyebrow" id="input-eyebrow"></span>
            <div class="segmented mode-switch" role="group" data-i18n-label="modeLabel">
              <button data-mode="decrypt" aria-pressed="true" data-i18n="tabDecrypt"></button>
              <button data-mode="encrypt" aria-pressed="false" data-i18n="tabEncrypt"></button>
            </div>
          </div>

          <div class="pane-body">
            <textarea id="cipher-input" spellcheck="false"></textarea>
            <textarea id="plain-input" spellcheck="false" class="hidden"></textarea>

            <!-- Decryption settings -->
            <div id="opts-decrypt">
              <div class="section">
                <h3 class="section-title" data-i18n="filtersLabel"></h3>
                <div class="chips" id="filters" role="group" data-i18n-label="filtersLabel"></div>
              </div>

              <div class="section hidden" id="pinbox">
                <h3 class="section-title" data-i18n="paramsLabel"></h3>
                <p class="hint" data-i18n="pinHint"></p>
                <div id="pinfields"></div>
              </div>

              <div class="section">
                <h3 class="section-title" data-i18n="bankLabel"></h3>
                <p class="hint" data-i18n="bankHint"></p>
                <div class="chips" id="banks" role="group" data-i18n-label="bankLabel"></div>
              </div>
            </div>

            <!-- Encryption settings -->
            <div id="opts-encrypt" class="hidden">
              <div class="section">
                <h3 class="section-title" data-i18n="chainLabel"></h3>
                <p class="hint" data-i18n="chainHint"></p>
                <div id="steps"></div>
                <div class="chain-foot">
                  <button class="ghost" id="add-step" data-i18n="addStep"></button>
                  <span class="step-count" id="step-count"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ═══ Right column: result ═══ -->
        <section class="pane pane-out">
          <div class="pane-head">
            <span class="eyebrow" id="output-eyebrow"></span>
            <span class="status" id="status" data-state="boot"></span>
          </div>
          <div class="pane-body">
            <div id="output" aria-live="polite"></div>
            <div id="encode-output" class="hidden" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </div>

    <!-- Explanatory card. `hidden` rather than folded away in CSS: a dialog
         left in the flow stays reachable by keyboard and read by screen readers
         even while invisible. -->
    <div class="modal-backdrop hidden" id="modal">
      <article class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" id="modal-close" data-i18n-label="close">✕</button>
        <p class="modal-era" id="modal-era"></p>
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-body" id="modal-body"></div>
      </article>
    </div>

    <footer data-i18n-html="footer"></footer>

      /* ══ Decryption settings ══ */
      function buildFilters() {
        $("filters").innerHTML = SEARCHABLE.map(
          ({ id }) =>
            `<span class="chip-pair" data-tip="${escapeHtml((SCOPE[lang] || {})[id] || "")}">` +
            `<button class="chip chip-method" data-cipher="${id}" ` +
            `title="${escapeHtml((SCOPE[lang] || {})[id] || "")}" ` +
            `aria-pressed="${filterState.has(id)}">${escapeHtml(t("ciphers")[id])}</button>` +
            `<button class="info-btn" data-info="${id}" ` +
            `aria-label="${escapeHtml(fill(t("aboutCipher"), { name: t("ciphers")[id] }))}">i</button></span>`
        ).join("");
        document.querySelectorAll("#filters button").forEach((button) => {
          button.onclick = () => {
            const name = button.dataset.cipher;
            filterState.has(name) ? filterState.delete(name) : filterState.add(name);
            button.setAttribute("aria-pressed", String(filterState.has(name)));
            buildPins();
            bindInfo();
            schedule(0);
          };
        });
      }

      function buildPins() {
        // Every selected method appears, adjustable or not. Filtering on the
        // presence of parameters removed half the methods from the panel, which
        // read as a defect rather than as an absence of settings.
        const shown = SEARCHABLE.filter((entry) => filterState.has(entry.id));
        $("pinbox").classList.toggle("hidden", shown.length === 0);

        $("pinfields").innerHTML = shown
          .map((entry) => {
            const rows = [];

            for (const [field, values] of Object.entries(entry.values || {})) {
              const selected = pinSet(entry.id, field);
              const step = (entry.group || {})[field];
              const notable = (entry.notable || {})[field] || [];
              let chips = notable
                .map(
                  (value) =>
                    `<button class="chip" data-pin="${entry.id}|${field}|${value}" ` +
                    `aria-pressed="${selected.has(value)}">${value}</button>`
                )
                .join("");

              if (step) {
                for (let start = values[0]; start <= values[values.length - 1]; start += step) {
                  const slice = values.filter((v) => v >= start && v < start + step);
                  if (!slice.length) continue;
                  chips +=
                    `<button class="chip chip-range" data-range="${entry.id}|${field}|${slice.join(",")}" ` +
                    `aria-pressed="${slice.every((v) => selected.has(v))}">` +
                    `${slice[0]}–${slice[slice.length - 1]}</button>`;
                }
              } else {
                chips += values
                  .filter((value) => !notable.includes(value))
                  .map(
                    (value) =>
                      `<button class="chip" data-pin="${entry.id}|${field}|${value}" ` +
                      `aria-pressed="${selected.has(value)}">${value}</button>`
                  )
                  .join("");
              }

              rows.push(
                `<div class="pinrow"><span class="tiny-label">${escapeHtml(labelOf(field))}</span>` +
                  `<button class="chip chip-all" data-all="${entry.id}|${field}" ` +
                  `aria-pressed="${selected.size === 0}">${escapeHtml(t("all"))}</button>${chips}</div>`
              );
            }

            for (const field of entry.text || []) {
              const value = (freeText[entry.id] || {})[field] ?? "";
              rows.push(
                `<div class="pinrow"><span class="tiny-label">${escapeHtml(labelOf(field))}</span>` +
                  `<input type="text" data-free="${entry.id}|${field}" value="${escapeHtml(value)}" ` +
                  `placeholder="${escapeHtml(t("all").toLowerCase())}" spellcheck="false" /></div>` +
                  (field === "key" ? `<p class="pinhint">${escapeHtml(t("keyHint"))}</p>` : "")
              );
            }

            // Boolean decryption options. Vigenere's autokey is the only one
            // so far; without it a text could be encrypted in autokey mode and
            // then no longer read back by this same tool.
            for (const flag of entry.flags || []) {
              const on = pinSet(entry.id, flag).has(1);
              rows.push(
                `<div class="pinrow"><span class="tiny-label">&nbsp;</span>` +
                  `<button class="chip" data-pin="${entry.id}|${flag}|1" ` +
                  `aria-pressed="${on}">` +
                  `${escapeHtml(t("f" + flag[0].toUpperCase() + flag.slice(1)))}</button></div>`
              );
            }

            if (entry.note) rows.push(`<p class="pinnote">${escapeHtml(t(entry.note))}</p>`);

            return `<div class="pinblock"><h4>${escapeHtml(t("ciphers")[entry.id])}</h4>${rows.join("")}</div>`;
          })
          .join("");

        document.querySelectorAll("[data-pin]").forEach((button) => {
          button.onclick = () => {
            const [cipher, field, value] = button.dataset.pin.split("|");
            const set = pinSet(cipher, field);
            const number = Number(value);
            set.has(number) ? set.delete(number) : set.add(number);
            buildPins();
            schedule(0);
          };
        });
        document.querySelectorAll("[data-range]").forEach((button) => {
          button.onclick = () => {
            const [cipher, field, list] = button.dataset.range.split("|");
            const set = pinSet(cipher, field);
            const values = list.split(",").map(Number);
            // A range already fully selected is cleared; otherwise it is
            // completed. Toggling value by value would leave partial selections
            // impossible to undo in one gesture.
            const full = values.every((v) => set.has(v));
            values.forEach((v) => (full ? set.delete(v) : set.add(v)));
            buildPins();
            schedule(0);
          };
        });
        document.querySelectorAll("[data-all]").forEach((button) => {
          button.onclick = () => {
            const [cipher, field] = button.dataset.all.split("|");
            pinSet(cipher, field).clear();
            buildPins();
            schedule(0);
          };
        });
        document.querySelectorAll("[data-free]").forEach((input) => {
          input.oninput = () => {
            const [cipher, field] = input.dataset.free.split("|");
            freeText[cipher] = freeText[cipher] || {};
            freeText[cipher][field] = input.value;
            schedule();
          };
        });
      }

      /* What the engine receives: only what was actually restricted. An empty set
         is not transmitted — the absence of a constraint must stay an absence,
         not a list of every value. */
      function readPins() {
        const out = {};
        for (const [cipher, fields] of Object.entries(pins)) {
          for (const [field, set] of Object.entries(fields)) {
            if (set.size) (out[cipher] = out[cipher] || {})[field] = Array.from(set);
          }
        }
        for (const [cipher, fields] of Object.entries(freeText)) {
          const spec = SPEC[cipher] || {};
          for (const [field, raw] of Object.entries(fields)) {
            const name = (spec.rename || {})[field] || field;
            if (MULTI_FIELDS.has(field)) {
              const values = String(raw).split(",").map((v) => v.trim()).filter(Boolean);
              if (values.length) (out[cipher] = out[cipher] || {})[name] = values;
            } else if (String(raw).length) {
              // No `.trim()`: a space *is* a valid separator, and stripping it
              // would make that setting impossible to express.
              (out[cipher] = out[cipher] || {})[name] = [String(raw)];
            }
          }
        }
        return out;
      }

      function buildBanks() {
        $("banks").innerHTML = BANKS.map(
          ({ code, label }) =>
            `<button class="chip chip-method" data-bank="${code}" ` +
            `aria-pressed="${loadedBanks.has(code)}">${label}</button>`
        ).join("");
        document.querySelectorAll("#banks button").forEach((button) => {
          const code = button.dataset.bank;
          if (loadedBanks.has(code)) return;
          button.onclick = () => loadBank(code, button);
        });
      }

      async function loadBank(code, button) {
        button.disabled = true;
        const original = button.textContent;
        button.textContent = t("bankLoading");
        try {
          const bank = await fetch(`banks/${code}.json`).then((response) => {
            if (!response.ok) throw new Error("bank not found");
            return response.json();
          });
          pyodide.globals.set("_bank", bank);
          // `load_bank` tells a language from a shared supplement on its own.
          // Calling `register_language` fails on the technical bank, which has
          // no frequency table.
          await pyodide.runPythonAsync("cipher.load_bank(_bank.to_py())");
          loadedBanks.add(code);
          buildBanks();
          schedule(0);
        } catch (error) {
          button.disabled = false;
          button.textContent = original;
          setStatus("error", t("bankFailed"));
        }
      }

      /* ══ Cipher chain ══ */
      const DEFAULT_VALUES = {
        shift: 3, a: 5, b: 8, key: "disyner", rails: 3, offset: 0, sep: " ", prefix: "",
      };
      const NUMBER_FIELDS = new Set(["shift", "a", "b", "rails", "offset"]);
      const LIMITS = { shift: [1, 93], b: [0, 25], rails: [2, 8], offset: [0, 12] };

      let steps = [newStep("caesar")];

      function newStep(method) {
        const spec = PARAMS[method] || { fields: [] };
        const values = {};
        for (const field of spec.fields) {
          values[field] = (spec.defaults || {})[field] ?? DEFAULT_VALUES[field] ?? "";
        }
        return { method, values, flags: new Set() };
      }

      function renderSteps() {
        $("steps").innerHTML = steps
          .map((step, index) => {
            const spec = PARAMS[step.method] || { fields: [] };

            // A method already at its cap is disabled in the list rather than
            // refused afterwards: a choice one cannot make beats a choice
            // silently undone. A step's own method stays selectable, otherwise
            // the step could no longer render.
            const methodSelect =
              `<div class="step-field"><span class="tiny-label">${escapeHtml(t("method"))}</span>` +
              `<select data-step-method="${index}" ` +
              `title="${escapeHtml((SCOPE[lang] || {})[step.method] || "")}">` +
              Object.keys(PARAMS)
                .map((id) => {
                  const own = id === step.method;
                  const full = !own && !canAdd(id);
                  return (
                    `<option value="${id}"${own ? " selected" : ""}${full ? " disabled" : ""}>` +
                    `${escapeHtml(t("ciphers")[id])}${full ? " ·" : ""}</option>`
                  );
                })
                .join("") +
              `</select></div>`;

            const fields = spec.fields
              .map((field) => {
                const value = step.values[field] ?? "";
                const label = escapeHtml(labelOf(field));
                if (field === "a") {
                  const options = AFFINE_A.map(
                    (v) => `<option value="${v}"${String(v) === String(value) ? " selected" : ""}>${v}</option>`
                  ).join("");
                  return (
                    `<div class="step-field"><span class="tiny-label">${label}</span>` +
                    `<select data-step-field="${index}|a">${options}</select></div>`
                  );
                }
                const limit = LIMITS[field]
                  ? ` min="${LIMITS[field][0]}" max="${LIMITS[field][1]}"`
                  : "";
                const type = NUMBER_FIELDS.has(field) ? "number" : "text";
                const wide = field === "key" ? " wide" : "";
                return (
                  `<div class="step-field${wide}"><span class="tiny-label">${label}</span>` +
                  `<input data-step-field="${index}|${field}" type="${type}"${limit} ` +
                  `value="${escapeHtml(value)}" spellcheck="false" /></div>`
                );
              })
              .join("");

            const flags = (spec.flags || [])
              .map(
                (flag) =>
                  `<button class="chip" data-step-flag="${index}|${flag}" ` +
                  `aria-pressed="${step.flags.has(flag)}">` +
                  `${escapeHtml(t("f" + flag[0].toUpperCase() + flag.slice(1)))}</button>`
              )
              .join("");

            return (
              `<div class="step"><span class="step-index">${index + 1}</span>${methodSelect}${fields}` +
              (flags ? `<div class="step-flags">${flags}</div>` : "") +
              `<button class="info-btn step-info" data-info="${step.method}" ` +
              `aria-label="${escapeHtml(fill(t("aboutCipher"), { name: t("ciphers")[step.method] }))}">i</button>` +
              `<button class="icon-btn" data-step-remove="${index}" ` +
              `${steps.length === 1 ? "disabled" : ""} ` +
              `aria-label="${escapeHtml(t("removeStep"))}">✕</button></div>`
            );
          })
          .join("");

        document.querySelectorAll("[data-step-method]").forEach((select) => {
          select.onchange = () => {
            // Changing method resets the values: the previous ones mean
            // nothing to the new method, and keeping them would produce mute
            // parameters that Python would ignore silently.
            steps[Number(select.dataset.stepMethod)] = newStep(select.value);
            renderSteps();
            schedule(0);
          };
        });
        document.querySelectorAll("[data-step-field]").forEach((input) => {
          input.oninput = input.onchange = () => {
            const [index, field] = input.dataset.stepField.split("|");
            steps[index].values[field] = input.value;
            schedule();
          };
        });
        document.querySelectorAll("[data-step-flag]").forEach((button) => {
          button.onclick = () => {
            const [index, flag] = button.dataset.stepFlag.split("|");
            const set = steps[index].flags;
            set.has(flag) ? set.delete(flag) : set.add(flag);
            renderSteps();
            schedule(0);
          };
        });
        document.querySelectorAll("[data-step-remove]").forEach((button) => {
          button.onclick = () => {
            steps.splice(Number(button.dataset.stepRemove), 1);
            renderSteps();
            schedule(0);
          };
        });

        // The count and the add-button state are recomputed on every render:
        // that is the only moment the chain length can have changed, and doing
        // it elsewhere would eventually drift.
        bindInfo();

        const saturated = steps.length >= MAX_STEPS || !Object.keys(PARAMS).some(canAdd);
        $("add-step").disabled = saturated;
        $("step-count").textContent = `${steps.length} / ${MAX_STEPS}`;
        $("step-count").classList.toggle("at-limit", saturated);
      }

      $("add-step").onclick = () => {
        if (steps.length >= MAX_STEPS) return;
        // The offered method is the first still available. Blindly adding
        // Base64 would produce an immediately invalid step once its two forms
        // are already taken.
        const next = Object.keys(PARAMS).find(canAdd);
        if (!next) return;
        steps.push(newStep(next));
        renderSteps();
        schedule(0);
      };

      /* ══ Automatic execution ══
         No button: typing triggers, settings trigger. Two safeguards, without
         which fast typing would launch one analysis per character and the
         answers would come back out of order:

         — a delay before starting, reset on every keystroke;
         — a lock during execution, with a single pending re-run. Pyodide has
           one thread: queueing ten calls does not speed them up, and only the
           latest screen state is of interest. */
      let timer = null;
      let running = false;
      let pending = false;

      function schedule(delay = 320) {
        clearTimeout(timer);
        timer = setTimeout(run, delay);
      }

      async function run() {
        if (!pyodide) return;
        if (running) { pending = true; return; }
        running = true;
        setStatus("busy", t("working"));
        try {
          await (mode === "decrypt" ? runDecrypt() : runEncrypt());
          setStatus("ready", t("ready"));
        } catch (error) {
          setStatus("error", String(error.message || error).split("\n").pop());
        } finally {
          running = false;
          if (pending) { pending = false; run(); }
        }
      }

      function setStatus(state, text) {
        $("status").dataset.state = state;
        $("status").textContent = text;
      }

      let lastReport = null;

      async function runDecrypt() {
        const text = $("cipher-input").value;
        if (!text.trim()) {
          lastReport = null;
          $("output").innerHTML = `<p class="empty">${escapeHtml(t("emptyInput"))}</p>`;
          return;
        }
        pyodide.globals.set("_text", text);
        pyodide.globals.set("_only", filterState.size ? Array.from(filterState) : null);
        pyodide.globals.set("_pins", readPins());
        const raw = await pyodide.runPythonAsync(`
only = list(_only) if _only is not None else None
pins = _pins.to_py() if _pins is not None else None
json.dumps(cipher.analyse(_text, only, pins).as_dict(), ensure_ascii=False)
        `);
        lastReport = JSON.parse(raw);
        render(lastReport);
      }

      let lastStages = null;

      async function runEncrypt() {
        const text = $("plain-input").value;
        if (!text.trim()) {
          lastStages = null;
          $("encode-output").innerHTML = `<p class="empty">${escapeHtml(t("emptyInput"))}</p>`;
          return;
        }
        const payload = steps.map((step) => {
          const spec = PARAMS[step.method] || { fields: [] };
          const params = {};
          for (const field of spec.fields) {
            const name = (spec.rename || {})[field] || field;
            // Numeric fields must cross as numbers: Python would refuse a
            // string for a rail count.
            params[name] = NUMBER_FIELDS.has(field)
              ? Number(step.values[field])
              : step.values[field];
          }
          for (const flag of spec.flags || []) params[flag] = step.flags.has(flag);
          return { cipher: step.method, params };
        });
        pyodide.globals.set("_text", text);
        pyodide.globals.set("_steps", payload);
        const raw = await pyodide.runPythonAsync(
          `json.dumps(cipher.encode_stages(_text, _steps.to_py()), ensure_ascii=False)`
        );
        lastStages = { text, stages: JSON.parse(raw) };
        renderStages(lastStages);
      }

      /* The readable detail is rebuilt here from the raw parameters. The engine
         returns data only, which is what allows "shift 3" to be displayed in
         any language without the engine knowing which. */

      /* The report comes back as families — letters, digits — rather than as a
         sentence, which is what allows it to be translated here rather than in
         the engine.

         Two messages, two severities. "Only the digits changed" is information:
         the method did its job, but its job does not cover everything. "Nothing
         changed" is a warning: the method was useless on this text. Merging
         them would mean crying wolf on every Caesar, which never touches digits
         and yet has no fault. */
      /* Loss is of a different nature from leakage and deserves its own message.
         A character that passes through intact is still there: awkward. A
         deleted character never comes back: serious. Displaying them the same
         way would claim that losing punctuation and leaving it in the clear are
         the same problem. */
      function lossNote(lost) {
        if (!lost || !lost.length) return "";
        const out = lost.map((k) => t("cls" + k[0].toUpperCase() + k.slice(1)));
        const joined =
          out.length === 1
            ? out[0]
            : out.slice(0, -1).join(", ") + " " + t("and") + " " + out.slice(-1);
        const sentence = fill(t("lossPermanent"), { what: joined });
        return `<p class="untouched alert">${escapeHtml(
          sentence.charAt(0).toUpperCase() + sentence.slice(1)
        )}</p>`;
      }

      function scopeNote(scope) {
        if (!scope || !scope.untouched || !scope.untouched.length) return "";
        const names = (list) => {
          const out = list.map((k) => t("cls" + k[0].toUpperCase() + k.slice(1)));
          return out.length === 1
            ? out[0]
            : out.slice(0, -1).join(", ") + " " + t("and") + " " + out.slice(-1);
        };
        const nothing = !scope.changed.length;
        // Both templates use the same variable names: a placeholder matching
        // nothing is silently replaced by an empty string, and the sentence
        // comes out truncated without any error being raised.
        const sentence = fill(nothing ? t("scopeNothing") : t("scopePartial"), {
          changed: names(scope.changed),
          untouched: names(scope.untouched),
        });
        // Family names are stored lowercase so they can be chained together;
        // only the first letter of the sentence is capitalised.
        return `<p class="untouched${nothing ? " alert" : ""}">${escapeHtml(
          sentence.charAt(0).toUpperCase() + sentence.slice(1)
        )}</p>`;
      }

      function detailOf(cipher, params) {
        const parts = [];
        if (params.shift !== undefined) parts.push(fill(t("dShift"), { v: params.shift }));
        if (params.a !== undefined) parts.push(`a=${params.a}, b=${params.b}`);
        if (params.rails !== undefined) {
          parts.push(fill(t("dRails"), { v: params.rails }));
          if (params.offset) parts.push(fill(t("dOffset"), { v: params.offset }));
        }
        if (params.key !== undefined) parts.push(fill(t("dKey"), { v: params.key }));
        if (!parts.length && ["base64", "hex", "binary", "morse"].includes(cipher)) {
          parts.push(t("dValid"));
        }
        return parts.join(", ");
      }

      function reasonText(report) {
        if (!report.reason) return "";
        let text = fill(t("reasons")[report.reason], report.reasonData || {});
        if (report.polyalphabetic) text += " " + t("reasons").polyalphabetic;
        return text;
      }

      function render(report) {
        const plain = report.alreadyPlain;
        const sure = report.reliable && !plain;

        /* Three verdicts, not two. "This text is not encrypted" is an answer in
           its own right: filing it among the failures would suggest the engine
           failed, when in fact it answered. */
        const tone = plain ? "plain" : sure ? "sure" : "unsure";
        const heading = plain ? t("headingPlain") : sure ? t("headingSure") : t("headingUnsure");
        const top = report.candidates[0];
        const message =
          reasonText(report) ||
          (top
            ? fill(t("fallback"), {
                label: t("ciphers")[top.cipher] || top.label,
                language: t("langOf")[top.language] || top.language,
              })
            : t("noCandidate"));

        let html = `
          <div class="verdict ${tone}">
            <b>${escapeHtml(heading)}</b>
            <p>${escapeHtml(message)}</p>
          </div>
          <div class="metrics">
            <div class="metric"><span>${escapeHtml(t("mLetters"))}</span><strong>${report.sampleLength}</strong></div>
            <div class="metric"><span>${escapeHtml(t("mIoc"))}</span><strong>${report.indexOfCoincidence.toFixed(3)}</strong></div>
            <div class="metric"><span>${escapeHtml(t("mCount"))}</span><strong>${report.candidates.length}</strong></div>
          </div>
          <div class="results">`;

        if (!report.candidates.length) {
          html += `<p class="empty">${escapeHtml(t("noCandidate"))}</p>`;
        }

        /* Every hypothesis is rendered, not the first four. A counter that
           contradicts what is shown is worse than no counter. The panel
           scrolls; space was never the problem. */
        report.candidates.forEach((candidate, index) => {
          const percent = Math.round(candidate.confidence * 100);
          const name = t("ciphers")[candidate.cipher] || candidate.label;
          const variants = candidate.variants || [];
          // The entrance delay is computed rather than fixed in CSS, which
          // could only describe four. It is capped: beyond that the last card
          // would arrive after the eye has already settled.
          const delay = Math.min(index * 0.035, 0.28).toFixed(3);

          html += `
            <article class="result ${index === 0 && sure ? "best" : ""}"
                     style="animation-delay:${delay}s">
              <div class="result-top">
                <span class="result-name">${escapeHtml(name)}</span>
                <span class="result-detail">${escapeHtml(detailOf(candidate.cipher, candidate.params))}</span>
                ${candidate.pinned ? `<span class="tag">${escapeHtml(t("pinnedTag"))}</span>` : ""}
                <span class="result-score">${percent}%</span>
              </div>
              <div class="bar"><i style="width:${percent}%"></i></div>
              <p class="plaintext">${escapeHtml(candidate.plaintext)}</p>
              ${scopeNote(candidate.scope)}
              <button class="peel" data-peel="${index}">${escapeHtml(t("peel"))}</button>`;

          if (variants.length) {
            const label =
              variants.length === 1
                ? t("variantsOne")
                : fill(t("variantsMany"), { n: variants.length });
            html += `
              <details class="variants">
                <summary>${escapeHtml(label)}</summary>
                <div class="variants-list">
                ${variants
                  .map(
                    (variant) => `
                  <div class="variant">
                    <span class="variant-params">${escapeHtml(detailOf(candidate.cipher, variant.params))}</span>
                    <span class="variant-text" title="${escapeHtml(variant.plaintext)}">${escapeHtml(variant.plaintext)}</span>
                    <span class="variant-score">${Math.round(variant.confidence * 100)}%</span>
                  </div>`
                  )
                  .join("")}
                </div>
              </details>`;
          }
          html += `</article>`;
        });

        $("output").innerHTML = html + "</div>";

        /* Take a result as the new input. Without this button, peeling a text
           encrypted in several layers meant selecting it with the mouse and
           pasting it back — and since removing one layer leaves something still
           unreadable and therefore badly scored, it was easy to believe the
           decryption had failed when it had succeeded. */
        document.querySelectorAll("[data-peel]").forEach((button) => {
          button.onclick = () => {
            $("cipher-input").value = report.candidates[Number(button.dataset.peel)].plaintext;
            $("cipher-input").focus();
            schedule(0);
          };
        });
      }

      function renderStages({ text, stages }) {
        let previous = text;
        const rows = stages
          .map((stage, index) => {
            const detail = Object.entries(stage.params)
              .filter(([, v]) => v !== "" && v !== false)
              .map(([k, v]) => `${k}=${v}`)
              .join(" ");
            // A step that changes nothing is flagged: that is the case of a
            // Caesar placed after Morse, where no letter is left.
            const inert = stage.output === previous;
            previous = stage.output;
            return `
              <div class="stage ${index === stages.length - 1 ? "final" : ""}">
                <span class="stage-label">${index + 1}. ${escapeHtml(t("ciphers")[stage.cipher])}
                  <span class="result-detail">${escapeHtml(detail)}</span></span>
                <span class="stage-text">${escapeHtml(stage.output)}${
                  inert ? ` <span class="stage-note">${escapeHtml(t("inert"))}</span>` : ""
                }${lossNote(stage.lost)}${scopeNote(stage.scope)}</span>
              </div>`;
          })
          .join("");

        const final = stages.length ? stages[stages.length - 1].output : text;
        $("encode-output").innerHTML =
          `<article class="result best">${rows}
             <button class="peel" id="reuse">${escapeHtml(t("reuse"))}</button>
           </article>`;
        $("reuse").onclick = () => {
          $("cipher-input").value = final;
          setMode("decrypt");
          schedule(0);
        };
      }


      /* ══ Explanatory card ══
         Three ways to close, because none suffices alone: the cross for those
         who look for it, the backdrop for those who click beside it, and Escape
         for those who never leave the keyboard. The key is registered once
         rather than on every open, otherwise listeners pile up. */
      let lastFocus = null;

      /* Cross-references between methods. The source text writes [[caesar]]; the
         page replaces it with a green button carrying the translated name. The
         text is escaped **before** links are inserted: the other way round would
         escape the markup just produced. */
      function linkify(text, current) {
        return escapeHtml(text).replace(/\[\[(\w+)\]\]/g, (_, id) => {
          const name = (t("ciphers") || {})[id];
          if (!name) return id;
          // A cross-reference to the card already open leads nowhere, so it is
          // rendered as emphasis rather than a dead button. This happens as soon
          // as a paragraph is shared between cards — the one about the ROT
          // family names all four members, whichever is being displayed.
          if (id === current) return `<em class="xref-self">${escapeHtml(name)}</em>`;
          return `<button class="xref" data-info="${id}">${escapeHtml(name)}</button>`;
        });
      }

      function section(key, open, inner) {
        return (
          `<details class="info-section"${open ? " open" : ""}>` +
          `<summary>${escapeHtml(t(key))}</summary>` +
          `<div class="info-content">${inner}</div></details>`
        );
      }

      function openInfo(id) {
        const entry = (INFO[lang] || {})[id];
        if (!entry) return;
        // The starting point is only recorded on the first open: when
        // following a cross-reference, focus must return to the original
        // button, not to the link just left.
        if ($("modal").classList.contains("hidden")) lastFocus = document.activeElement;

        $("modal-era").textContent = entry.era;
        $("modal-title").textContent = t("ciphers")[id] || id;

        let how = entry.how.map((p) => `<p>${linkify(p, id)}</p>`).join("");
        if (entry.diagram && DIAGRAMS[entry.diagram]) {
          how += `<pre class="diagram">${escapeHtml(DIAGRAMS[entry.diagram])}</pre>`;
        }
        const history = entry.history.map((p) => `<p>${linkify(p, id)}</p>`).join("");
        const params = entry.params.length
          ? "<dl>" + entry.params
              .map(([name, effect]) => `<dt>${escapeHtml(name)}</dt><dd>${linkify(effect, id)}</dd>`)
              .join("") + "</dl>"
          : `<p>${escapeHtml(t("infoNoParams"))}</p>`;

        $("modal-body").innerHTML =
          section("infoHow", true, how) +
          section("infoHistory", false, history) +
          section("infoParams", false, params);

        $("modal").classList.remove("hidden");
        $("modal-card").scrollTop = 0;
        bindInfo();
        $("modal-close").focus();
      }

      function closeInfo() {
        $("modal").classList.add("hidden");
        // Focus returns where it came from: otherwise it falls back to the top
        // of the document and keyboard navigation restarts from scratch.
        if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
      }

      $("modal-close").onclick = closeInfo;
      $("modal").onclick = (event) => {
        // Only the backdrop closes. Without this test a click inside the card
        // would bubble up here and close it immediately.
        if (event.target === $("modal")) closeInfo();
      };
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !$("modal").classList.contains("hidden")) closeInfo();
      });

      function bindInfo() {
        document.querySelectorAll("[data-info]").forEach((button) => {
          button.onclick = (event) => {
            event.preventDefault();
            openInfo(button.dataset.info);
          };
        });
      }

      /* ══ Mode et langue ══ */
      function setMode(next) {
        mode = next;
        document.querySelectorAll("[data-mode]").forEach((button) =>
          button.setAttribute("aria-pressed", String(button.dataset.mode === next))
        );
        const decrypting = next === "decrypt";
        $("cipher-input").classList.toggle("hidden", !decrypting);
        $("plain-input").classList.toggle("hidden", decrypting);
        $("opts-decrypt").classList.toggle("hidden", !decrypting);
        $("opts-encrypt").classList.toggle("hidden", decrypting);
        $("output").classList.toggle("hidden", !decrypting);
        $("encode-output").classList.toggle("hidden", decrypting);
        $("input-eyebrow").textContent = decrypting ? t("inputCipher") : t("inputPlain");
        $("output-eyebrow").textContent = decrypting ? t("outputDecrypt") : t("outputEncrypt");
        schedule(0);
      }
      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.onclick = () => setMode(button.dataset.mode);
      });

      function applyLanguage(next) {
        lang = next;
        document.documentElement.lang = next;
        document.querySelectorAll("[data-lang]").forEach((button) =>
          button.setAttribute("aria-pressed", String(button.dataset.lang === next))
        );
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = t(element.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((element) => {
          element.innerHTML = t(element.dataset.i18nHtml);
        });
        document.querySelectorAll("[data-i18n-label]").forEach((element) => {
          element.setAttribute("aria-label", t(element.dataset.i18nLabel));
        });
        $("cipher-input").placeholder = t("placeholderCipher");
        $("plain-input").placeholder = t("placeholderPlain");
        $("input-eyebrow").textContent = mode === "decrypt" ? t("inputCipher") : t("inputPlain");
        $("output-eyebrow").textContent = mode === "decrypt" ? t("outputDecrypt") : t("outputEncrypt");
        buildFilters();
        buildPins();
        buildBanks();
        renderSteps();
        bindInfo();
        // The last result is re-rendered in the new language rather than
        // recomputed: switching language must cost the engine nothing.
        if (mode === "decrypt" && lastReport) render(lastReport);
        if (mode === "encrypt" && lastStages) renderStages(lastStages);
        if (pyodide) setStatus("ready", t("ready"));
      }
      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.onclick = () => applyLanguage(button.dataset.lang);
      });

      /* ══ Startup ══ */
      let pyodide = null;

      async function boot() {
        setStatus("boot", t("booting"));
        try {
          pyodide = await loadPyodide();
          const source = await fetch("cipher.py").then((response) => {
            if (!response.ok) throw new Error("cipher.py not found");
            return response.text();
          });
          pyodide.FS.writeFile("cipher.py", source);
          await pyodide.runPythonAsync("import cipher, json");
          setStatus("ready", t("ready"));
          run();
        } catch (error) {
          setStatus("error", t("bootFailed"));
        }
      }

      $("cipher-input").oninput = () => schedule();
      $("plain-input").oninput = () => schedule();

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      $("cipher-input").value = SAMPLE_CIPHER;
      $("plain-input").value = SAMPLE_PLAIN;
      applyLanguage("en");
      setMode("decrypt");
      boot();
    </script>
  </body>
</html>
